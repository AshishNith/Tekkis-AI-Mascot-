# Production: Tekkie behind Caddy, which gets and renews the HTTPS certificate automatically.
# Values come from .env next to this file (written by deploy/install.sh).
services:
  tekkie:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      TRUST_PROXY: "1"
      # The website itself, plus the Android app (Capacitor pages run on https://localhost).
      ALLOWED_ORIGINS: "https://${TEKKIE_DOMAIN},https://localhost"
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - tekkie
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TEKKIE_DOMAIN: "${TEKKIE_DOMAIN}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
